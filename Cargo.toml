[package]
name = "badr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local Business Rule and Architecture Decision Records"
license = "MIT"

[profile.release]
# Stripped proc-macro libraries fail dyld alignment checks on macOS 27.
strip = "none"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"
tempfile = "3.27"
gherkin = { version = "=0.14.0", default-features = false, features = ["parser"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
saphyr-parser = "0.2.2"
pulldown-cmark = { version = "0.13", default-features = false }
yaml-rust2 = { version = "0.11", default-features = false }
sha2 = "0.10"
rustix = { version = "1.1", features = ["fs"] }
