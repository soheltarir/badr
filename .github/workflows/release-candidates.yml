name: Native release candidates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install minimum source toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.0
      - run: cargo check --locked --all-targets
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Prepare and verify native candidate without network at runtime
        run: sh scripts/prepare-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: badr-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*-VERIFIED.txt
          if-no-files-found: error
          retention-days: 14

  homebrew:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
      - uses: actions/download-artifact@v4
        with:
          pattern: badr-*
          path: dist/archives
          merge-multiple: true
      - run: python3 packaging/homebrew/test_prepare.py
      - name: Prepare unpublished tap definition
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          mkdir -p dist/tap/Formula
          python3 scripts/prepare-homebrew.py "$version" dist/archives > dist/tap/Formula/badr.rb
      - name: Verify native Homebrew install and revision upgrade
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          sh scripts/verify-homebrew.sh "$version" dist/archives 2>&1 | tee dist/homebrew-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-${{ matrix.runner }}
          path: |
            dist/tap/
            dist/homebrew-verification.txt
          if-no-files-found: error
          retention-days: 14
