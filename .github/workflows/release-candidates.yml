name: Native release candidates
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/json-schema-v1.json"
      - "install.sh"
      - ".github/workflows/release-candidates.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install minimum source toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.0
      - run: sh -n install.sh
      - run: python3 scripts/test-install.py
      - run: cargo check --locked --all-targets
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Prepare and verify native candidate without network at runtime
        run: sh scripts/prepare-release.sh '${{ matrix.target }}'
      - name: Verify installer against native candidate
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          BADR_INSTALL_DIR="$RUNNER_TEMP/badr-installed" sh install.sh --archive "dist/badr-$version-${{ matrix.target }}.tar.gz"
          test "$("$RUNNER_TEMP/badr-installed/badr" --version)" = "badr $version"
      - uses: actions/upload-artifact@v4
        with:
          name: badr-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*-VERIFIED.txt
          if-no-files-found: error
          retention-days: 14

